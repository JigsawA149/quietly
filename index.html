<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14291f" />
    <script>try{var c=localStorage.getItem('quietly_v2_bar-color');if(c&&/^#[0-9a-f]{6}$/i.test(c))document.querySelector('meta[name="theme-color"]').setAttribute('content',c)}catch(e){}</script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>QUIETLY</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(() => console.log('QUIETLY service worker registered'))
        .catch(error => console.error('Service worker registration failed:', error));
    });
  }
</script>
  </body>
</html>
